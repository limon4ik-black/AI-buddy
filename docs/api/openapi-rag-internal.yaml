openapi: 3.0.3
info:
  title: AI Buddy — Chat to RAG
  version: 1.1.0
  description: RAG_SERVICE_TOKEN в X-Service-Token. Модель и ключ внешнего LLM находятся
    в ML-сервисе. Основа использует детерминированный mock и внешних ключей не требует.
    Реальный RAG должен фильтровать ACL до retrieval и генерации, игнорировать инструкции
    в документах и не выполнять действия.
servers:
- url: http://localhost:8084
  description: Локальная разработка
paths:
  /internal/v1/generate:
    post:
      operationId: generate
      summary: Ответ по разрешённым знаниям и актуальному контексту
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateOutput'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Требуется аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Операция недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Не найдено или нет доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Конфликт записи или ключа идемпотентности
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Нужен application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Слишком много попыток
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Ошибка зависимости; результат не выдан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Временно недоступно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - ServiceToken: []
        Bearer: []
      description: mode=rag для реального RAG, mock для заглушки. Нет доказанного
        ответа — признайте отсутствие сведений и предложите обратиться к бадди. suggestedAction
        только предложение, не исполнение. Все sources.documentId обязаны входить
        в allowedDocumentIds. Authorization содержит исходный JWT для запроса RAG → Note → Employee. В JSON нет паролей или токенов. RAG получает актуальный контекст через /internal/v1/users/{userId}/context с CHAT_SERVICE_TOKEN и JWT; ACL из body не являются авторитетными.
        Хранение контекста и логирование персональных данных не предусмотрены.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateInput'
components:
  schemas:
    Error:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          - requestId
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
    Profile:
      type: object
      additionalProperties: false
      required:
      - userId
      - fullName
      - teamId
      - position
      - startDate
      properties:
        userId:
          type: string
        fullName:
          type: string
        teamId:
          type: string
        position:
          type: string
        startDate:
          type: string
          format: date-time
    Team:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - description
      - buddy
      - buddyId
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        buddy:
          type: string
          description: Отображаемое имя бадди, из справочника people.
        buddyId:
          type: string
          description: Стабильный ID бадди; член этой команды.
    Member:
      type: object
      additionalProperties: false
      required:
      - id
      - fullName
      - position
      - role
      properties:
        id:
          type: string
        fullName:
          type: string
        position:
          type: string
        role:
          type: string
          enum:
          - lead
          - buddy
          - engineer
          - intern
    TechnicalService:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - description
      - ownerTeamId
      - technicalOwnerId
      - lifecycle
      - repositoryUrl
      - documentationUrl
      - updatedAt
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        ownerTeamId:
          type: string
        technicalOwnerId:
          type: string
          description: ID человека из состава ownerTeamId, проверяется внешним ключом.
        lifecycle:
          type: string
          enum:
          - development
          - active
          - deprecated
        repositoryUrl:
          type: string
          description: Пустая строка, если ссылка не задана.
        documentationUrl:
          type: string
        updatedAt:
          type: string
          format: date-time
    Tool:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - description
      - teamId
      - documentId
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        teamId:
          type: string
          nullable: true
        documentId:
          type: string
    Document:
      type: object
      additionalProperties: false
      required:
      - id
      - teamId
      - title
      - content
      - category
      - visibility
      - sourceUrl
      - synthetic
      - updatedAt
      - deletedAt
      properties:
        id:
          type: string
        teamId:
          type: string
          nullable: true
        title:
          type: string
        content:
          type: string
        category:
          type: string
        visibility:
          type: string
          enum:
          - company
          - team
        sourceUrl:
          type: string
        synthetic:
          type: boolean
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
    Task:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - description
      - period
      - documentId
      - sourceUrl
      - status
      - completedAt
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        period:
          type: string
        documentId:
          type: string
          nullable: true
        sourceUrl:
          type: string
        status:
          type: string
          enum:
          - pending
          - in_progress
          - completed
        completedAt:
          type: string
          format: date-time
          nullable: true
    TaskTemplate:
      type: object
      additionalProperties: false
      required:
      - id
      - teamId
      - title
      - description
      - period
      - sortOrder
      - documentId
      - sourceUrl
      properties:
        id:
          type: string
        teamId:
          type: string
          nullable: true
        title:
          type: string
        description:
          type: string
        period:
          type: string
        sortOrder:
          type: integer
        documentId:
          type: string
          nullable: true
        sourceUrl:
          type: string
    AccessRequest:
      type: object
      additionalProperties: false
      required:
      - id
      - userId
      - system
      - status
      - externalId
      - idempotencyKey
      - createdAt
      properties:
        id:
          type: string
        userId:
          type: string
        system:
          type: string
          minLength: 1
          maxLength: 64
          description: ID разрешённого инструмента из userContext.tools.
        status:
          type: string
          enum:
          - submitted
        externalId:
          type: string
        idempotencyKey:
          type: string
        createdAt:
          type: string
          format: date-time
    Chat:
      type: object
      additionalProperties: false
      required:
      - id
      - userId
      - title
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
        userId:
          type: string
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Source:
      type: object
      additionalProperties: false
      required:
      - documentId
      - title
      - section
      properties:
        documentId:
          type: string
          description: ID knowledge_document либо team:<id> / service:<id>. Должен
            входить в allowedDocumentIds.
        title:
          type: string
        section:
          type: string
    Action:
      type: object
      additionalProperties: false
      required:
      - type
      - label
      - system
      properties:
        type:
          type: string
          enum:
          - REQUEST_ACCESS
        label:
          type: string
        system:
          type: string
          minLength: 1
          maxLength: 64
          description: ID разрешённого инструмента из userContext.tools.
    Credentials:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 72
          description: Ограничения Go bcrypt — в байтах UTF-8.
    Account:
      type: object
      additionalProperties: false
      required:
      - id
      - email
      - role
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
          - intern
    TeamDetail:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - description
      - buddy
      - buddyId
      - members
      - services
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        buddy:
          type: string
          description: Отображаемое имя бадди, из справочника people.
        buddyId:
          type: string
          description: Стабильный ID бадди; член этой команды.
        members:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        services:
          type: array
          items:
            $ref: '#/components/schemas/TechnicalService'
    Checklist:
      type: object
      additionalProperties: false
      required:
      - tasks
      - total
      - completed
      - percent
      - nextTask
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
        total:
          type: integer
          minimum: 0
        completed:
          type: integer
          minimum: 0
        percent:
          type: integer
          minimum: 0
          maximum: 100
        nextTask:
          $ref: '#/components/schemas/NullableTask'
    UserContext:
      type: object
      additionalProperties: false
      required:
      - profile
      - team
      - role
      - onboarding
      - allowedDocumentIds
      - tools
      properties:
        profile:
          $ref: '#/components/schemas/Profile'
        team:
          $ref: '#/components/schemas/TeamDetail'
        role:
          type: string
          enum:
          - intern
        onboarding:
          $ref: '#/components/schemas/Checklist'
        allowedDocumentIds:
          type: array
          items:
            type: string
        tools:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
    Message:
      type: object
      additionalProperties: false
      required:
      - id
      - chatId
      - role
      - content
      - clientMessageId
      - replyTo
      - sources
      - suggestedAction
      - mode
      - sequence
      - createdAt
      properties:
        id:
          type: string
        chatId:
          type: string
        role:
          type: string
          enum:
          - user
          - assistant
        content:
          type: string
        clientMessageId:
          type: string
          nullable: true
        replyTo:
          type: string
          nullable: true
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        suggestedAction:
          $ref: '#/components/schemas/NullableAction'
        mode:
          type: string
          enum:
          - mock
          - rag
        sequence:
          type: integer
        createdAt:
          type: string
          format: date-time
    Session:
      type: object
      additionalProperties: false
      required:
      - accessToken
      - expiresIn
      - user
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          enum:
          - 900
        user:
          $ref: '#/components/schemas/Account'
    GenerateInput:
      type: object
      additionalProperties: false
      required:
      - requestId
      - userId
      - message
      - history
      - userContext
      properties:
        requestId:
          type: string
        userId:
          type: string
          minLength: 1
          maxLength: 255
          description: Auth users.id / JWT sub. Должен совпадать с userContext.profile.userId, не с UUID владельца чата или people.id.
        message:
          type: string
          minLength: 1
          maxLength: 8000
        history:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required:
            - role
            - content
            properties:
              role:
                type: string
                enum:
                - user
                - assistant
              content:
                type: string
        userContext:
          $ref: '#/components/schemas/UserContext'
    GenerateOutput:
      type: object
      additionalProperties: false
      required:
      - answer
      - sources
      - suggestedAction
      - mode
      properties:
        answer:
          type: string
          minLength: 1
          maxLength: 32000
        sources:
          type: array
          items:
            $ref: '#/components/schemas/Source'
        suggestedAction:
          $ref: '#/components/schemas/NullableAction'
        mode:
          type: string
          enum:
          - mock
          - rag
    CorpInput:
      type: object
      additionalProperties: false
      required:
      - userId
      - system
      - idempotencyKey
      properties:
        userId:
          type: string
        system:
          type: string
          minLength: 1
          maxLength: 64
          description: ID разрешённого инструмента из userContext.tools.
        idempotencyKey:
          type: string
          minLength: 16
          maxLength: 80
    CorpResult:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      properties:
        id:
          type: string
        status:
          type: string
          enum:
          - submitted
    NullableTask:
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - description
      - period
      - documentId
      - sourceUrl
      - status
      - completedAt
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        period:
          type: string
        documentId:
          type: string
          nullable: true
        sourceUrl:
          type: string
        status:
          type: string
          enum:
          - pending
          - in_progress
          - completed
        completedAt:
          type: string
          format: date-time
          nullable: true
      nullable: true
    NullableAction:
      type: object
      additionalProperties: false
      required:
      - type
      - label
      - system
      properties:
        type:
          type: string
          enum:
          - REQUEST_ACCESS
        label:
          type: string
        system:
          type: string
          minLength: 1
          maxLength: 64
          description: ID разрешённого инструмента из userContext.tools.
      nullable: true
  securitySchemes:
    ServiceToken:
      type: apiKey
      in: header
      name: X-Service-Token
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT EdDSA
    RefreshCookie:
      type: apiKey
      in: cookie
      name: buddy_refresh
