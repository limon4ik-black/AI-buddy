      - ServiceToken: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
  /internal/v1/services:
    get:
      operationId: listServices
      summary: Технические сервисы и владельцы
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
