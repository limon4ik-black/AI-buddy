  /internal/v1/checklist/templates:
    get:
      operationId: listTaskTemplates
      summary: Шаблон чек-листа без персонального прогресса
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
