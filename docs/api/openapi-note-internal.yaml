        '503':
          description: Временно недоступно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - ServiceToken: []
      parameters:
      - name: ownerTeamId
        in: query
        required: false
        schema:
          type: string
  /internal/v1/services/{id}:
    get:
      operationId: getService
      summary: Карточка технического сервиса
      responses:
