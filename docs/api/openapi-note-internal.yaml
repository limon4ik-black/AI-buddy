openapi: 3.0.3
info:
  title: AI Buddy — Note / RAG HTTP contract
  version: 1.1.0
  description: Справочник и контекст адаптации. Read-only корпоративные справочники
    доступны доверенному индексатору по INDEXER_SERVICE_TOKEN. Контекст пользователя
    требует CHAT_SERVICE_TOKEN И пользовательский JWT. Никогда не передавайте индексаторный
    токен в браузер. Все демо-данные синтетические.
servers:
- url: http://localhost:8079
  description: Локальная разработка
paths:
  /internal/v1/teams:
    get:
      operationId: listTeams
      summary: Список команд (company-visible)
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - synthetic
                - visibility
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Team'
                  synthetic:
                    type: boolean
                  visibility:
                    type: string
                    enum:
                    - company
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Требуется аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Операция недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Не найдено или нет доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Конфликт записи или ключа идемпотентности
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Нужен application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Слишком много попыток
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Ошибка зависимости; результат не выдан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Временно недоступно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - ServiceToken: []
