  /api/v1/teams:
    get:
      operationId: publicListteams
      summary: Список команд (company-visible)
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - items
                - synthetic
                - visibility
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Team'
                  synthetic:
                    type: boolean
                  visibility:
                    type: string
                    enum:
                    - company
        '400':
