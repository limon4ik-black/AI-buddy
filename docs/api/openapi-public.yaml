openapi: 3.0.3
info:
  title: AI Buddy — public API
  version: 1.1.0
  description: Браузер обращается к Gateway. Для защищённых операций нужен JWT; сервисный
    токен браузеру не передаётся. HttpOnly SameSite=Strict refresh-cookie, access
    token только в памяти. Тела ограничены 1 MiB, строки сообщений — байтами UTF-8.
servers:
- url: http://localhost:8080
  description: Локальная разработка
paths:
  /api/v1/auth/register:
    post:
      operationId: authRegister
      summary: >-
        Заявка на регистрацию: пароль сохранён в заявке, код уходит на почту.
        Аккаунт создаётся только после /auth/confirm.
      responses:
        '201':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSent'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Требуется аутентификация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Операция недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Не найдено или нет доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Конфликт записи или ключа идемпотентности
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Нужен application/json
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Слишком много попыток
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Ошибка зависимости; результат не выдан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Временно недоступно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
  /api/v1/auth/login:
    post:
      operationId: authLogin
      summary: >-
        Логин по паролю: отправляет одноразовый код на почту (для заявки
        регистрации тоже работает).
      responses:
        '200':
          description: Успех
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeSent'
        '400':
          description: Некорректный запрос
          content:
            application/json:
              schema:
