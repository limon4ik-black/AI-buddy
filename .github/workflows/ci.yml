name: contracts-and-tests
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_USER: buddy_test, POSTGRES_PASSWORD: test-only, POSTGRES_DB: postgres}
        ports: ['5432:5432']
        options: --health-cmd='pg_isready -U buddy_test -d postgres' --health-interval=5s --health-timeout=3s --health-retries=10
    env:
      TEST_DB_ADMIN_URL: postgres://buddy_test:test-only@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.24.x', cache-dependency-path: backend/go.sum}
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r scripts/requirements-qa.txt
      - run: bash scripts/test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: validation-reports, path: reports/}
