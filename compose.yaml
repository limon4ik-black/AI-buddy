name: ai-buddy
x-runtime: &runtime
  restart: unless-stopped
  init: true
  networks: [app]
  healthcheck:
    test: [CMD-SHELL, 'wget -q -O - http://127.0.0.1:$${PORT}/healthz || exit 1']
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 15s
x-identity: &identity
  JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?Run scripts/configure.sh first}
  GATEWAY_SERVICE_TOKEN: ${GATEWAY_SERVICE_TOKEN:?Run scripts/configure.sh first}
services:
  postgres:
    image: postgres:17.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: buddy_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure.sh first}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      INFO_DB_PASSWORD: ${INFO_DB_PASSWORD}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-db.sh:/docker-entrypoint-initdb.d/01-databases.sh:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U buddy_admin -d postgres']
      interval: 5s
      timeout: 3s
      retries: 10
  auth:
    <<: *runtime
    build: {context: ./backend, args: {SERVICE: auth}}
    networks: [app, database]
    environment:
      <<: *identity
      PORT: 8081
      LISTEN_ADDR: ':8081'
      JWT_PRIVATE_SEED: ${JWT_PRIVATE_SEED}
      DATABASE_URL: postgres://auth_user:${AUTH_DB_PASSWORD}@postgres:5432/auth_db?sslmode=disable
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on: {postgres: {condition: service_healthy}}
  info:
    <<: *runtime
    build: {context: ./backend, args: {SERVICE: info}}
    networks: [app, database]
    ports: ['127.0.0.1:8082:8082']
    environment:
      <<: *identity
      PORT: 8082
      LISTEN_ADDR: ':8082'
      DATABASE_URL: postgres://info_user:${INFO_DB_PASSWORD}@postgres:5432/info_db?sslmode=disable
      CHAT_SERVICE_TOKEN: ${CHAT_SERVICE_TOKEN}
      INDEXER_SERVICE_TOKEN: ${INDEXER_SERVICE_TOKEN}
      SEED_DEMO: ${SEED_DEMO:-true}
      CORP_SERVICE_TOKEN: ${CORP_SERVICE_TOKEN}
      CORP_URL: http://corpmock:8085
    depends_on: {postgres: {condition: service_healthy}}
  chat:
    <<: *runtime
    build: {context: ./backend, args: {SERVICE: chat}}
    networks: [app, database]
    environment:
      <<: *identity
      PORT: 8083
      LISTEN_ADDR: ':8083'
      DATABASE_URL: postgres://chat_user:${CHAT_DB_PASSWORD}@postgres:5432/chat_db?sslmode=disable
      CHAT_SERVICE_TOKEN: ${CHAT_SERVICE_TOKEN}
      RAG_SERVICE_TOKEN: ${RAG_SERVICE_TOKEN}
      INFO_URL: http://info:8082
      RAG_URL: ${RAG_URL:-http://ragmock:8084}
    depends_on: {postgres: {condition: service_healthy}, info: {condition: service_healthy}}
  ragmock:
    <<: *runtime
    build: {context: ./backend, args: {SERVICE: ragmock}}
    environment: {PORT: 8084, LISTEN_ADDR: ':8084', RAG_SERVICE_TOKEN: '${RAG_SERVICE_TOKEN}'}
  corpmock:
    <<: *runtime
    build: {context: ./backend, args: {SERVICE: corpmock}}
    environment: {PORT: 8085, LISTEN_ADDR: ':8085', CORP_SERVICE_TOKEN: '${CORP_SERVICE_TOKEN}'}
  gateway:
    <<: *runtime
    build: {context: ./backend, args: {SERVICE: gateway}}
    environment:
      <<: *identity
      PORT: 8080
      LISTEN_ADDR: ':8080'
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
    depends_on: {auth: {condition: service_healthy}, info: {condition: service_healthy}, chat: {condition: service_healthy}}
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ['127.0.0.1:8080:80']
    networks: [app]
    depends_on: {gateway: {condition: service_healthy}}
networks:
  app: {}
  database: {internal: true}
volumes:
  pgdata: {}
