server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff;
 add_header Referrer-Policy strict-origin-when-cross-origin;
 add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'";
 location /api/ {
  proxy_pass http://gateway:8080;
  proxy_read_timeout 45s;
  proxy_set_header Host $host;
 }
 # Заметки — отдельный сервис: проксируем в него, чтобы браузер ходил в свой origin
 # (CSP connect-src 'self' запрещает запросы на чужой адрес).
 location /notes-api/ {
  proxy_pass http://note_service:8079/api/v1/;
  proxy_read_timeout 45s;
  proxy_set_header Host $host;
 }
 # Доски — тот же сервис: сцена холста весит мегабайты, поэтому поднимаем предел тела
 # (по умолчанию nginx обрывает запрос на 1 МиБ и отдаёт 413).
 location /board-api/ {
  proxy_pass http://note_service:8079/api/v1/;
  client_max_body_size 12m;
  proxy_read_timeout 60s;
  proxy_set_header Host $host;
 }
 location / { try_files $uri $uri/ /index.html; }
}
