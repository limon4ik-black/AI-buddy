server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 add_header X-Content-Type-Options nosniff;
 add_header Referrer-Policy strict-origin-when-cross-origin;
 add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'";
 location /api/ {
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_pass http://gateway:8080;
  proxy_read_timeout 190s;
  proxy_set_header Host $host;
 }
 # Заметки — отдельный сервис: проксируем в него, чтобы браузер ходил в свой origin
 # (CSP connect-src 'self' запрещает запросы на чужой адрес).
 #
 # Имя сервиса nginx резолвит один раз при старте и держит адрес. После любого
 # пересоздания note_service адрес меняется, и здесь начинается 502 «Блокнот
 # недоступен», хотя сервис жив. Поэтому резолвим через DNS докера на каждый
 # запрос, а префикс пути переписываем явно (с переменной в proxy_pass nginx
 # не подставляет путь сам).
 resolver 127.0.0.11 valid=10s ipv6=off;
 location /notes-api/ {
  set $note_service note_service:8079;
  rewrite ^/notes-api/(.*)$ /api/v1/$1 break;
  proxy_pass http://$note_service;
  proxy_read_timeout 45s;
  proxy_set_header Host $host;
 }
 # Доски — тот же сервис: сцена холста весит мегабайты, поэтому поднимаем предел тела
 # (по умолчанию nginx обрывает запрос на 1 МиБ и отдаёт 413).
 location /board-api/ {
  set $note_service note_service:8079;
  rewrite ^/board-api/(.*)$ /api/v1/$1 break;
  proxy_pass http://$note_service;
  client_max_body_size 12m;
  proxy_read_timeout 60s;
  proxy_set_header Host $host;
 }
 location / { try_files $uri $uri/ /index.html; }
}
