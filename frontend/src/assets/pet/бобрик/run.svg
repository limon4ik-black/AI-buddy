<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- тень -->
  <ellipse cx="98" cy="207" rx="58" ry="9" fill="#17171A" opacity="0.07"/>

  <!-- полосы скорости -->
  <path d="M8 122 h22 M2 142 h26 M10 162 h20" stroke="#A9C6F5" stroke-width="4" stroke-linecap="round" opacity="0.55"/>

  <!-- хвост: поток позади -->
  <g transform="rotate(24 40 142)">
    <ellipse cx="40" cy="142" rx="38" ry="20" fill="#2E5BD8"/>
    <path d="M14 142 h52 M22 132 v20 M34 128 v28 M46 130 v24" stroke="#2244A8" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- весь корпус с наклоном вперёд -->
  <g transform="rotate(-7 100 140)">
    <!-- лапы в беге -->
    <ellipse cx="126" cy="186" rx="15" ry="8" fill="#3D6BE0" transform="rotate(-28 126 186)"/>
    <ellipse cx="72" cy="190" rx="15" ry="8" fill="#3D6BE0" transform="rotate(30 72 190)"/>

    <!-- ручки прижаты -->
    <ellipse cx="50" cy="146" rx="11" ry="17" fill="#3D6BE0" transform="rotate(35 50 146)"/>
    <ellipse cx="142" cy="132" rx="11" ry="17" fill="#3D6BE0" transform="rotate(-30 142 132)"/>

    <!-- тело -->
    <ellipse cx="98" cy="146" rx="58" ry="55" fill="#4A7DF0"/>
    <!-- животик -->
    <ellipse cx="98" cy="158" rx="38" ry="32" fill="#E8F1FF"/>

    <!-- лого на животе -->
    <rect x="87" y="146" width="22" height="22" rx="7" fill="#F91155"/>
    <circle cx="98" cy="157" r="6" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>

    <!-- шарф -->
    <path d="M50 124 Q98 144 146 124 L146 138 Q98 158 50 138 Z" fill="#F91155"/>
    <circle cx="143" cy="142" r="8" fill="#F9739E"/>

    <!-- уши назад -->
    <circle cx="66" cy="42" r="14" fill="#4A7DF0" transform="rotate(-14 66 42)"/>
    <circle cx="66" cy="42" r="6.5" fill="#F91155" transform="rotate(-14 66 42)"/>
    <circle cx="126" cy="40" r="14" fill="#4A7DF0" transform="rotate(-10 126 40)"/>
    <circle cx="126" cy="40" r="6.5" fill="#F91155" transform="rotate(-10 126 40)"/>

    <!-- голова -->
    <circle cx="96" cy="86" r="50" fill="#4A7DF0"/>

    <!-- щёчки -->
    <circle cx="62" cy="94" r="9" fill="#F9739E" opacity="0.4"/>
    <circle cx="132" cy="92" r="9" fill="#F9739E" opacity="0.4"/>

    <!-- мордочка -->
    <ellipse cx="96" cy="101" rx="33" ry="23" fill="#E8F1FF"/>
    <ellipse cx="97" cy="91" rx="8" ry="6.5" fill="#1E3AA8"/>
    <rect x="89" y="98" width="7.5" height="14" rx="3.5" fill="#FFFFFF" stroke="#D6E2F5" stroke-width="1.5"/>
    <rect x="97.5" y="98" width="7.5" height="14" rx="3.5" fill="#FFFFFF" stroke="#D6E2F5" stroke-width="1.5"/>

    <!-- глазки-щёлочки: сосредоточен -->
    <path d="M70 72 q7 -6 14 0" stroke="#1E3AA8" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M106 72 q7 -6 14 0" stroke="#1E3AA8" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
</svg>
