<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- тень: оторвался от земли -->
  <ellipse cx="98" cy="210" rx="44" ry="7" fill="#17171A" opacity="0.05"/>
  <!-- пыль от прыжка -->
  <circle cx="52" cy="204" r="7" fill="#17171A" opacity="0.08"/>
  <circle cx="68" cy="208" r="5" fill="#17171A" opacity="0.08"/>
  <circle cx="140" cy="206" r="6" fill="#17171A" opacity="0.08"/>

  <!-- искры-звёздочки -->
  <path d="M28 46 v12 M22 52 h12" stroke="#F91155" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M172 70 v10 M167 75 h10" stroke="#4A7DF0" stroke-width="3" stroke-linecap="round"/>

  <!-- хвост поднят -->
  <g transform="rotate(-40 152 118)">
    <ellipse cx="152" cy="118" rx="36" ry="19" fill="#2E5BD8"/>
    <path d="M126 118 h52 M134 107 v22 M148 103 v30 M162 104 v28" stroke="#2244A8" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- весь корпус в прыжке -->
  <g transform="translate(0 -16)">
    <!-- лапки поджаты -->
    <ellipse cx="72" cy="178" rx="13" ry="8" fill="#3D6BE0" transform="rotate(-22 72 178)"/>
    <ellipse cx="120" cy="176" rx="13" ry="8" fill="#3D6BE0" transform="rotate(18 120 176)"/>

    <!-- ручки вверх -->
    <ellipse cx="42" cy="102" rx="11" ry="18" fill="#3D6BE0" transform="rotate(38 42 102)"/>
    <ellipse cx="148" cy="102" rx="11" ry="18" fill="#3D6BE0" transform="rotate(-38 148 102)"/>

    <!-- тело -->
    <ellipse cx="95" cy="146" rx="59" ry="55" fill="#4A7DF0"/>
    <!-- животик -->
    <ellipse cx="95" cy="158" rx="39" ry="32" fill="#E8F1FF"/>

    <!-- лого на животе -->
    <rect x="84" y="146" width="22" height="22" rx="7" fill="#F91155"/>
    <circle cx="95" cy="157" r="6" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>

    <!-- шарф -->
    <path d="M47 124 Q95 144 143 124 L143 138 Q95 158 47 138 Z" fill="#F91155"/>
    <circle cx="140" cy="142" r="8" fill="#F9739E"/>

    <!-- уши -->
    <circle cx="62" cy="38" r="15" fill="#4A7DF0"/>
    <circle cx="62" cy="38" r="7" fill="#F91155"/>
    <circle cx="128" cy="38" r="15" fill="#4A7DF0"/>
    <circle cx="128" cy="38" r="7" fill="#F91155"/>

    <!-- голова -->
    <circle cx="95" cy="84" r="52" fill="#4A7DF0"/>

    <!-- щёчки -->
    <circle cx="60" cy="92" r="9" fill="#F9739E" opacity="0.4"/>
    <circle cx="130" cy="92" r="9" fill="#F9739E" opacity="0.4"/>

    <!-- мордочка -->
    <ellipse cx="95" cy="99" rx="34" ry="24" fill="#E8F1FF"/>
    <ellipse cx="95" cy="89" rx="8" ry="6.5" fill="#1E3AA8"/>
    <!-- открытый рот с зубками -->
    <ellipse cx="95" cy="107" rx="13" ry="9" fill="#1E3AA8"/>
    <rect x="88" y="99" width="7" height="9" rx="3" fill="#FFFFFF"/>
    <rect x="96" y="99" width="7" height="9" rx="3" fill="#FFFFFF"/>

    <!-- глазки-радость -->
    <path d="M70 72 q7 -8 14 0" stroke="#1E3AA8" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M106 72 q7 -8 14 0" stroke="#1E3AA8" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>
</svg>
