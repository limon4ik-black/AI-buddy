[project]
name = "llm-service"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "sentence-transformers>=6.2.0",
    "torch>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
