global:
  scrape_interval: 10s
  evaluation_interval: 30s

scrape_configs:
  # Цели лежат по файлу на сервис (file_sd): команда сервиса владеет своим
  # файлом в targets/ и не правит общий конфиг, поэтому новая цель — это
  # новый файл, а не конфликт в общем.
  #
  # Скрейпим каждый сервис напрямую по имени в сети приложения, а не через
  # nginx или шлюз: иначе служебный трафик искажал бы его же цифры, а
  # мониторинг зависел бы от того, что мониторит.
  - job_name: services
    file_sd_configs:
      - files: ['/etc/prometheus/targets/*.json']
        refresh_interval: 30s
