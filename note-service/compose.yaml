services:
  note_postgres:
    image: postgres:18.1-bookworm
    container_name: note_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/.pgdata:/var/lib/postgresql
    restart: always
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  # Сервис в докере: в БД ходит по сети compose (note_postgres:5432), наружу отдаёт 8079.
  note_service:
    build:
      context: .
    container_name: note_service
    depends_on:
      note_postgres:
        condition: service_healthy
    environment:
      PORT: 8079
      POSTGRES_HOST: note_postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_TIMEOUT: ${POSTGRES_TIMEOUT:-10s}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ${PROJECT_ROOT}/out/logs:/app/out/logs
    user: "1000:1000"          # чтобы лог-файлы на хосте были твои, а не root
    ports:
      - "127.0.0.1:8079:8079"
    networks:
      - default
      - app            # сеть проекта AI-buddy: по ней фронт достаёт сервис по имени note_service
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O - http://127.0.0.1:$${PORT}/healthz || exit 1']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  note_postgres_migrate:
    image: migrate/migrate:v4.19.1
    volumes: 
      - ${PROJECT_ROOT}/migrations:/migrations

  port_forwarder:
    image: alpine/socat:1.8.0.3
    container_name: note_pg_port_forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:note_postgres:5432
    ports:
      - "127.0.0.1:5432:5432"

  # Генератор openapi из аннотаций в коде. Локально swag не ставится: запускается как разовая задача.
  swag:
    image: golang:1.27-bookworm
    container_name: note_swag
    working_dir: /app
    user: "1000:1000"          # иначе docs/ окажется root-owned
    environment:
      - HOME=/tmp
      - GOCACHE=/tmp/gocache   # /tmp внутри контейнера пишется без правки владельцев
      - GOMODCACHE=/tmp/gomodcache
    volumes:
      - ${PROJECT_ROOT}:/app
    command: go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g cmd/note-service/main.go -o docs --parseInternal

networks:
  app:
    external: true
    name: ai-buddy_app   # создаётся стеком AI-buddy; поднимать её нужно раньше нашего сервиса